# PostgreSQL profile - Used with Docker Compose
# To start: java -jar app.jar --spring.profiles.active=postgres
# or: set SPRING_PROFILES_ACTIVE=postgres

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/bankingdb
    driver-class-name: org.postgresql.Driver
    username: banking_user
    password: banking_pass
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: update  # Automatically update schema in PostgreSQL
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

# Read JWT secret from environment variable (security)
jwt:
  secret: ${JWT_SECRET:CoreBankingApiSecretKey2024ProductionReplaceThis!!}
